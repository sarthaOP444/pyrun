<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#6750A4">
<title>PyRun · Python Compiler</title>
<style>
:root{
  --p:#6750A4;--on-p:#fff;--pc:#EADDFF;--on-pc:#21005D;
  --s:#625B71;--sc:#E8DEF8;--on-sc:#1D192B;
  --bg:#FEF7FF;--on-bg:#1D1B20;
  --sf:#F3EDF7;--sf2:#ECE6F0;--sf3:#E6E0E9;
  --var:#49454F;--out:#CAC4D0;--err:#B3261E;--ok:#2E7D32;--code:#1D1B20;
  --sh:0 1px 3px rgba(0,0,0,.2),0 4px 8px 3px rgba(0,0,0,.08);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --p:#D0BCFF;--on-p:#381E72;--pc:#4F378B;--on-pc:#EADDFF;
  --s:#CCC2DC;--sc:#4A4458;--on-sc:#E8DEF8;
  --bg:#141218;--on-bg:#E6E0E9;--sf:#211F26;--sf2:#2B2930;--sf3:#36343B;
  --var:#CAC4D0;--out:#49454F;--err:#F2B8B5;--ok:#81C784;--code:#E6E0E9;color-scheme:dark}}
:root[data-theme="dark"]{
  --p:#D0BCFF;--on-p:#381E72;--pc:#4F378B;--on-pc:#EADDFF;
  --s:#CCC2DC;--sc:#4A4458;--on-sc:#E8DEF8;
  --bg:#141218;--on-bg:#E6E0E9;--sf:#211F26;--sf2:#2B2930;--sf3:#36343B;
  --var:#CAC4D0;--out:#49454F;--err:#F2B8B5;--ok:#81C784;--code:#E6E0E9;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--on-bg);font:400 14px/20px Roboto,"Segoe UI",system-ui,sans-serif;overflow:hidden}
.app{display:flex;flex-direction:column;height:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg{width:24px;height:24px;fill:currentColor;flex:none}
/* top bar */
header{display:flex;align-items:center;gap:4px;padding:8px 8px 8px 16px;background:var(--bg);min-height:64px}
header h1{font:400 22px/28px inherit;margin:0;flex:1;display:flex;align-items:center;gap:10px;font-family:inherit}
.logo{width:32px;height:32px;border-radius:10px;background:var(--pc);color:var(--on-pc);display:grid;place-items:center;font-weight:700;font-size:15px}
.ib{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--var);position:relative;overflow:hidden}
.ib:hover,.ib:focus-visible{background:color-mix(in srgb,var(--on-bg) 10%,transparent);outline:0}
.ib:active{background:color-mix(in srgb,var(--on-bg) 16%,transparent)}
/* chips */
.chips{display:flex;gap:8px;padding:4px 16px 12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--out);color:var(--var);white-space:nowrap;font-weight:500;flex:none}
.chip:hover{background:var(--sf2)}
.chip.on{background:var(--sc);color:var(--on-sc);border-color:transparent}
/* panes */
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 16px}
.pane{background:var(--sf);border-radius:28px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ph{display:flex;align-items:center;gap:8px;padding:12px 16px 8px 20px;color:var(--var);font-weight:500;letter-spacing:.1px}
.ph span.grow{flex:1}
.ph .meta{font-size:12px;font-weight:400}
.editor{flex:1;min-height:0;display:flex;position:relative;font:13.5px/21px "Roboto Mono",ui-monospace,Consolas,Menlo,monospace}
.gutter{padding:8px 8px 8px 16px;text-align:right;color:var(--out);user-select:none;overflow:hidden;white-space:pre;min-width:48px}
textarea#code{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--code);font:inherit;padding:8px 16px 8px 4px;tab-size:4;white-space:pre;overflow:auto;caret-color:var(--p)}
#out{flex:1;min-height:0;margin:0;padding:8px 20px 16px;overflow:auto;font:13.5px/21px "Roboto Mono",ui-monospace,Consolas,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
#out .e{color:var(--err)}#out .i{color:var(--p)}#out .ok{color:var(--ok)}#out .d{color:var(--var);opacity:.8}
.empty{color:var(--var);opacity:.7;font-family:inherit}
#out input.ti{background:transparent;border:0;outline:0;color:var(--p);font:inherit;padding:0;margin:0;min-width:4ch;caret-color:var(--p)}
.stdin label{position:absolute;top:-8px;left:12px;background:var(--sf);padding:0 4px;font-size:12px;color:var(--var)}
.stdin textarea{width:100%;height:56px;resize:vertical;border:1px solid var(--var);border-radius:12px;background:transparent;color:var(--on-bg);padding:10px 14px;font:13px/18px "Roboto Mono",ui-monospace,Consolas,monospace;outline:0}
.stdin textarea:focus{border:2px solid var(--p);padding:9px 13px}
.cw{position:relative;flex:1;min-width:0}
.cw #hl,.cw #code{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:8px 16px 8px 4px;font:inherit;white-space:pre;tab-size:4;border:0}
.cw #hl{overflow:hidden;pointer-events:none;color:var(--code)}
.cw #code{color:transparent;background:transparent}
.editor.wrap .cw #hl,.editor.wrap .cw #code{white-space:pre-wrap;overflow-wrap:anywhere}
.editor.wrap .cw #code{overflow-x:hidden;scrollbar-width:none}
.editor.wrap .cw #code::-webkit-scrollbar{display:none}
.cw{overflow:hidden}
#mz{position:absolute;left:0;top:0;height:0;overflow:hidden;visibility:hidden;pointer-events:none;padding:8px 16px 8px 4px;font:inherit;white-space:pre-wrap;overflow-wrap:anywhere;tab-size:4}
#mz div{min-height:21px}
#code::selection{background:color-mix(in srgb,var(--p) 35%,transparent)}
#hl i{font-style:normal}#hl .k{color:var(--p)}#hl .s{color:var(--ok)}#hl .c{color:var(--var);font-style:italic;opacity:.8}
#hl .n{color:color-mix(in srgb,var(--err) 75%,var(--on-bg))}#hl .b{color:color-mix(in srgb,var(--p) 55%,var(--ok))}#hl .d{color:var(--s)}#hl .f{color:color-mix(in srgb,var(--p) 60%,var(--on-bg))}
.gutter b{color:var(--err);background:color-mix(in srgb,var(--err) 18%,transparent);font-weight:700;display:inline-block;min-width:100%}
.kb{display:flex;gap:6px;padding:6px 12px 8px;overflow-x:auto;scrollbar-width:none;background:var(--sf2)}
.kb::-webkit-scrollbar{display:none}
.kb button{flex:none;min-width:40px;height:36px;padding:0 10px;border-radius:10px;background:var(--sf3);color:var(--on-bg);font:500 14px "Roboto Mono",ui-monospace,monospace}
.kb button.sg{background:var(--pc);color:var(--on-pc)}
.kb button:active{filter:brightness(.9)}
.sep{flex:none;width:1px;background:var(--out);margin:4px 2px}
.dlg .tf+.tf{margin-top:12px}
.dlg label{position:absolute;top:-8px;left:12px;background:var(--sf3);padding:0 4px;font-size:12px;color:var(--var)}
.menu{max-height:calc(100vh - 80px);overflow-y:auto}
header .fab{position:static;height:40px;padding:0 16px 0 12px;border-radius:20px;box-shadow:none;gap:8px;font-size:14px;margin-right:4px;flex:none}
header .fab svg{width:20px;height:20px}
.pane.full{position:fixed;inset:0;z-index:12;border-radius:0;display:flex !important;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.rn{display:none;color:var(--p)}.full .rn{display:grid}
/* extended FAB */
.fab{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));height:56px;padding:0 20px 0 16px;border-radius:16px;background:var(--pc);color:var(--on-pc);display:flex;align-items:center;gap:12px;font-weight:500;font-size:15px;box-shadow:var(--sh);z-index:5;transition:transform .15s}
.fab:active{transform:scale(.96)}
.fab.stop{background:var(--err);color:var(--bg)}
.fab[disabled]{opacity:.6}
/* nav bar (mobile) */
nav{display:none;background:var(--sf2);height:80px;padding:12px 8px 16px;justify-content:space-around}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--var);flex:1}
nav .pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .2s}
nav button.on{color:var(--on-bg)}nav button.on .pill{background:var(--sc);color:var(--on-sc)}
@media (max-width:839px){
  main{grid-template-columns:1fr;padding:0 12px 8px}
  main .pane{display:none}main[data-tab="e"] #pe,main[data-tab="o"] #po{display:flex}
  nav{display:flex}.fab{bottom:calc(96px + env(safe-area-inset-bottom,0px));right:16px}
  header h1{font-size:20px}
}
/* menu, dialog, snackbar */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.scrim.open{display:flex}
.dlg{background:var(--sf3);border-radius:28px;padding:24px;width:min(100%,360px);box-shadow:var(--sh)}
.dlg h2{margin:0 0 8px;font:400 24px/32px inherit;font-family:inherit}
.dlg p{margin:0 0 16px;color:var(--var);white-space:pre-wrap}
.tf{position:relative;margin-top:8px}
.tf input{width:100%;height:56px;border-radius:4px;border:1px solid var(--var);background:transparent;color:var(--on-bg);padding:0 16px;font:16px inherit;font-family:inherit;outline:0}
.tf input:focus{border:2px solid var(--p);padding:0 15px}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
.tb{height:40px;padding:0 12px;border-radius:20px;color:var(--p);font-weight:500}
.tb:hover{background:color-mix(in srgb,var(--p) 10%,transparent)}
.tb.f{background:var(--p);color:var(--on-p);padding:0 24px}
.menu{position:fixed;top:60px;right:12px;background:var(--sf2);border-radius:12px;padding:8px 0;min-width:220px;box-shadow:var(--sh);z-index:15;display:none}
.menu.open{display:block}
.menu button{display:flex;align-items:center;gap:12px;width:100%;height:48px;padding:0 16px;text-align:left}
.menu button:hover{background:color-mix(in srgb,var(--on-bg) 8%,transparent)}
.menu hr{border:0;border-top:1px solid var(--out);margin:8px 0}
.sb{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--on-bg);color:var(--bg);padding:14px 16px;border-radius:4px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:calc(100% - 32px)}
.sb.show{opacity:1;transform:translate(-50%,0)}
.load{position:absolute;inset:0;background:var(--bg);z-index:40;display:grid;place-items:center;transition:opacity .3s}
.load.hide{opacity:0;pointer-events:none}
.spin{width:48px;height:48px;border-radius:50%;border:5px solid var(--sc);border-top-color:var(--p);animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="load" id="load"><div style="text-align:center"><div class="spin" style="margin:0 auto 16px"></div><div style="color:var(--var)">Loading Python engine…</div></div></div>
<div class="app">
  <header>
    <h1><span class="logo">Py</span>PyRun</h1>
    <button class="fab" id="fab" aria-label="Run"><svg viewBox="0 0 24 24" id="fi"><path d="M8 5v14l11-7z"/></svg><span id="fl">Run</span></button>
    <button class="ib" id="bTheme" title="Toggle theme" aria-label="Toggle theme"><svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 100 10 5 5 0 000-10zm0-5h0v3h0V2zm0 17v3h0v-3zM2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" fill="currentColor"/></svg></button>
    <button class="ib" id="bMenu" title="More" aria-label="More"><svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 100-4 2 2 0 000 4zm0 2a2 2 0 100 4 2 2 0 000-4zm0 6a2 2 0 100 4 2 2 0 000-4z"/></svg></button>
  </header>
  <div class="chips" id="chips"><span id="fch" style="display:contents"></span><span class="sep"></span><span id="sch" style="display:contents"></span></div>
  <main id="main" data-tab="e">
    <section class="pane" id="pe">
      <div class="ph"><span class="grow" id="fname">main.py</span><span class="meta" id="pos">Ln 1, Col 1</span><button class="ib rn" title="Run" aria-label="Run" style="width:36px;height:36px"><svg viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M8 5v14l11-7z"/></svg></button><button class="ib fx" data-p="pe" title="Fullscreen" aria-label="Fullscreen editor" style="width:36px;height:36px"><svg viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button></div>
      <div class="editor"><div class="gutter" id="gut">1</div><div class="cw"><pre id="hl" aria-hidden="true"></pre><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Python code"></textarea><div id="mz" aria-hidden="true"></div></div></div>
      <div class="kb" id="kb"><span id="sug" style="display:contents"></span><span id="keys" style="display:contents"></span></div>
    </section>
    <section class="pane" id="po">
      <div class="ph"><span class="grow">Output</span><span class="meta" id="time"></span><button class="ib rn" title="Run" aria-label="Run" style="width:36px;height:36px"><svg viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M8 5v14l11-7z"/></svg></button><button class="ib fx" data-p="po" title="Fullscreen" aria-label="Fullscreen output" style="width:36px;height:36px"><svg viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button><button class="ib" id="bClear" title="Clear" aria-label="Clear output" style="width:36px;height:36px"><svg viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M6 19a2 2 0 002 2h8a2 2 0 002-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button></div>
      <pre id="out"><span class="empty">Press Run to execute your code.</span></pre>
    </section>
  </main>
  <nav>
    <button class="on" data-t="e"><span class="pill"><svg viewBox="0 0 24 24"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg></span>Editor</button>
    <button data-t="o"><span class="pill"><svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zm0 14H4V8h16v10zM6.5 10L5 11.5 7.5 14 5 16.5 6.5 18l4-4-4-4zM12 16h6v-1.5h-6V16z"/></svg></span>Output</button>
  </nav>
</div>

<div class="menu" id="menu">
  <button data-a="newf"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6zm4 18H6V4h7v5h5v11z"/></svg>New file</button>
  <button data-a="ren"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zM20.7 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>Rename file</button>
  <button data-a="del"><svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 002 2h8a2 2 0 002-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>Delete file</button>
  <hr>
  <button data-a="find"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 109.5 16a6.5 6.5 0 004.2-1.6l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 110-9 4.5 4.5 0 010 9z"/></svg>Find &amp; replace</button>
  <button data-a="goto"><svg viewBox="0 0 24 24"><path d="M4 11h12.2l-5.6-5.6L12 4l8 8-8 8-1.4-1.4 5.6-5.6H4v-2z"/></svg>Go to line</button>
  <button data-a="cmt"><svg viewBox="0 0 24 24"><path d="M4 4h16v12H5.2L4 17.2V4zm2 2v7.4L5.2 14H18V6H6z"/></svg>Comment / uncomment</button>
  <button data-a="undo"><svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05 1-6.9 2.6L2 7v9h9l-3.6-3.6A8 8 0 0120 16l2.4-.8A10.5 10.5 0 0012.5 8z"/></svg>Undo</button>
  <button data-a="redo"><svg viewBox="0 0 24 24"><path d="M18.4 10.6A10.5 10.5 0 0011.5 8c-4.6 0-8.5 3-9.9 7.2L4 16a8 8 0 0112.6-3.6L13 16h9V7l-3.6 3.6z"/></svg>Redo</button>
  <button data-a="cdb"><svg viewBox="0 0 24 24"><path d="M12 3C7.6 3 4 4.3 4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6c0-1.7-3.6-3-8-3zm0 2c3.9 0 6 1 6 1s-2.1 1-6 1-6-1-6-1 2.1-1 6-1z"/></svg>Clear databases</button>
  <button data-a="share"><svg viewBox="0 0 24 24"><path d="M18 16a3 3 0 00-2 .8l-7-4.1a3 3 0 000-1.4l7-4.1A3 3 0 1015 5l.1.7-7 4.1a3 3 0 100 4.4l7.1 4.1-.1.7a3 3 0 103-3z"/></svg>Share code</button>
  <hr>
  <button data-a="save"><svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>Download .py</button>
  <button data-a="open"><svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>Open file…</button>
  <button data-a="copy"><svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 00-2 2v14h2V3h12V1zm3 4H8a2 2 0 00-2 2v14a2 2 0 002 2h11a2 2 0 002-2V7a2 2 0 00-2-2zm0 16H8V7h11v14z"/></svg>Copy code</button>
  <hr>
  <button data-a="wrap"><svg viewBox="0 0 24 24"><path d="M4 19h6v-2H4v2zM20 5H4v2h16V5zm-3 6H4v2h13.25c1.1 0 2 .9 2 2s-.9 2-2 2H15v-2l-3 3 3 3v-2h2c2.21 0 4-1.79 4-4s-1.79-4-4-4z"/></svg>Word wrap</button>
  <button data-a="font"><svg viewBox="0 0 24 24"><path d="M9 4v3h5v12h3V7h5V4H9zM3 12h3v7h3v-7h3V9H3v3z"/></svg>Font size</button>
  <button data-a="reset"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 11-6 6H4a8 8 0 108-8z"/></svg>Reset editor</button>
</div>
<input type="file" id="file" accept=".py,text/x-python,text/plain" hidden>
<div class="sb" id="sb" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/brython@3.13.1/brython.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/brython@3.13.1/brython_stdlib.js"></script>
<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
var code=$("code"),out=$("out"),gut=$("gut"),fab=$("fab"),running=false;
var SAMPLES={
"Input":'# input() works inline in the output, like Pydroid\nname = input("Name: ")\nage = int(input("Age: "))\nprint(f"{name} will be {age + 1} next year")\n',
"Hello":'# Welcome to PyRun\nprint("Hello, world!")\n\nfor i in range(1, 4):\n    print("Count:", i)\n',
"Fibonacci":'def fib(n):\n    a, b = 0, 1\n    for _ in range(n):\n        yield a\n        a, b = b, a + b\n\nprint(list(fib(15)))\nprint("Sum:", sum(fib(15)))\n',

# -----------------------------
# 1. DATABASE CONNECTION
# -----------------------------

conn = sqlite3.connect("expenses.db")
cursor = conn.cursor()

CREATE TABLE IF NOT EXISTS transactions (
    id INTEGER PRIMARY KEY AUTOINCREMENT,
    transaction_type TEXT NOT NULL,
    amount REAL NOT NULL,
    category TEXT NOT NULL,
    description TEXT,
    date TEXT NOT NULL
)
""")

conn.commit()


# -----------------------------
# 2. ADD TRANSACTION
# -----------------------------

def add_transaction():

    transaction_type = input(
        "Enter type (income/expense): "
    ).lower().strip()

    if transaction_type not in ["income", "expense"]:
        print("Invalid type!")
        return

    try:
        amount = float(input("Enter amount: "))

        if amount <= 0:
            print("Amount must be positive!")
            return

    except ValueError:
        print("Invalid amount!")
        return

    category = input("Enter category: ").strip()
    description = input("Enter description: ").strip()

    transaction_date = input(
        "Enter date (YYYY-MM-DD), Enter for today: "
    ).strip()

    if not transaction_date:
        transaction_date = date.today().isoformat()

    try:
        date.fromisoformat(transaction_date)
    except ValueError:
        print("Invalid date!")
        return

    if not category:
        print("Category cannot be empty!")
        return

    cursor.execute("""
        INSERT INTO transactions
        (transaction_type, amount, category, description, date)
        VALUES (?, ?, ?, ?, ?)
    """, (
        transaction_type,
        amount,
        category,
        description,
        transaction_date
    ))

    conn.commit()

    print("Transaction added successfully!")


# -----------------------------
# 3. SHOW TRANSACTIONS
# -----------------------------

def show_transactions():

    cursor.execute("""
        SELECT * FROM transactions
        ORDER BY date DESC, id DESC
    """)

    records = cursor.fetchall()

    if not records:
        print("No transactions found.")
        return

    for row in records:

        print(
            f"ID: {row[0]} | "
            f"Type: {row[1]} | "
            f"Amount: ₹{row[2]:.2f} | "
            f"Category: {row[3]} | "
            f"Description: {row[4]} | "
            f"Date: {row[5]}"
        )


# -----------------------------
# 4. FINANCIAL SUMMARY
# -----------------------------

def show_summary():

    cursor.execute("""
        SELECT SUM(amount)
        FROM transactions
        WHERE transaction_type = 'income'
    """)

    income = cursor.fetchone()[0] or 0

    cursor.execute("""
        SELECT SUM(amount)
        FROM transactions
        WHERE transaction_type = 'expense'
    """)

    expenses = cursor.fetchone()[0] or 0

    balance = income - expenses

    print("\n===== FINANCIAL SUMMARY =====")

    print(f"Income: ₹{income:.2f}")
    print(f"Expenses: ₹{expenses:.2f}")
    print(f"Balance: ₹{balance:.2f}")


# -----------------------------
# 5. SEARCH CATEGORY
# -----------------------------

def search_category():

    category = input("Enter category: ").strip()

    cursor.execute("""
        SELECT * FROM transactions
        WHERE category = ?
        ORDER BY date DESC
    """, (category,))

    records = cursor.fetchall()

    if not records:
        print("No transactions found.")
        return

    for row in records:

        print(
            f"{row[5]} | {row[3]} | "
            f"₹{row[2]:.2f} | {row[4]}"
        )


# -----------------------------
# 6. MAIN MENU
# -----------------------------

def main():

    while True:

        print("\n========================")
        print("     EXPENSE TRACKER")
        print("========================")

        print("1. Add Transaction")
        print("2. Show Transactions")
        print("3. Financial Summary")
        print("4. Search Category")
        print("5. Exit")

        choice = input("Choose option: ")

        if choice == "1":
            add_transaction()

        elif choice == "2":
            show_transactions()

        elif choice == "3":
            show_summary()

        elif choice == "4":
            search_category()

        elif choice == "5":
            print("Goodbye!")
            break

        else:
            print("Invalid choice!")


# -----------------------------
# 7. RUN APPLICATION
# -----------------------------

try:
    main()
finally:
    conn.close()
